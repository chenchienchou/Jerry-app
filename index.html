<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>台南垃圾車班表</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none;}
:root{
  --bg:#0B0F19;--bg2:#111827;--gold:#F59E0B;
  --emerald:#10B981;--neon-blue:#00F2FE;--panel:rgba(17,24,39,0.90);
  --border:rgba(245,158,11,0.13);--text:#F1F5F9;--muted:#94A3B8;
  --yellow-neon:#FFE500;--green-neon:#00FF9D;
  --card:rgba(11,17,30,0.94);
}
.light-mode{
  --bg:#F0F4F8;--bg2:#E2E8F0;--gold:#D97706;--panel:rgba(240,244,248,0.94);
  --border:rgba(37,99,235,0.15);--text:#1E293B;--muted:#64748B;
  --card:rgba(255,255,255,0.97);--yellow-neon:#B45309;--green-neon:#059669;
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',system-ui,sans-serif;}
#app{display:flex;flex-direction:column;width:100%;height:100dvh;
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);}

/* ── TOP PANEL ── */
#top-panel{position:relative;z-index:1000;padding:10px 14px 8px;
  background:var(--panel);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-bottom:1px solid var(--border);flex-shrink:0;}
#status-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
#status-dot{width:8px;height:8px;border-radius:50%;background:var(--emerald);
  flex-shrink:0;animation:pulse-dot 2s ease-in-out infinite;}
#status-text{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.4px;flex:1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#theme-btn{width:30px;height:30px;border-radius:50%;background:var(--bg2);
  border:1px solid var(--border);cursor:pointer;display:flex;align-items:center;
  justify-content:center;font-size:14px;flex-shrink:0;transition:transform .2s;}
#theme-btn:active{transform:scale(.88);}
#district-scroll{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;touch-action:pan-x;overscroll-behavior-x:contain;}
#district-scroll::-webkit-scrollbar{display:none;}
.district-btn{flex-shrink:0;padding:5px 12px;border-radius:20px;font-size:11px;font-weight:700;
  background:var(--bg2);border:1px solid var(--border);color:var(--muted);
  cursor:pointer;transition:all .18s;white-space:nowrap;-webkit-tap-highlight-color:transparent;}
.district-btn.active,.district-btn:active{background:var(--gold);color:#000;border-color:var(--gold);}

/* ── SKELETON ── */
#skeleton{position:absolute;inset:0;z-index:500;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  transition:opacity .7s ease;pointer-events:none;}
#skeleton.hidden{opacity:0;}
.sk-bar{height:13px;border-radius:7px;
  background:linear-gradient(90deg,rgba(255,255,255,.04) 0%,rgba(255,255,255,.13) 45%,rgba(255,255,255,.04) 90%);
  background-size:200% 100%;animation:shimmer 1.7s infinite;}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
#progress-text{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.4px;}
#prog-wrap{width:150px;height:3px;background:rgba(255,255,255,.07);border-radius:3px;overflow:hidden;}
#prog-bar{height:100%;width:0%;background:linear-gradient(90deg,var(--gold),var(--neon-blue));
  border-radius:3px;transition:width .3s ease;}

/* ── MAP ── */
#map{flex:1;z-index:1;position:relative;}
.leaflet-container{background:#090D16!important;}
.light-mode .leaflet-container{background:#E8EEF4!important;}
.leaflet-pane.leaflet-shadow-pane{mix-blend-mode:plus-lighter;}

/* ── BOTTOM NAV ── */
#bottom-nav{display:flex;align-items:center;justify-content:space-around;
  padding:6px 0 calc(6px + env(safe-area-inset-bottom));
  background:var(--panel);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-top:1px solid var(--border);z-index:1000;flex-shrink:0;}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:2px;
  width:52px;height:52px;border-radius:14px;border:none;background:none;
  cursor:pointer;transition:transform .15s;justify-content:center;
  -webkit-tap-highlight-color:transparent;}
.nav-btn:active{transform:scale(.85);}
.nav-icon{font-size:21px;line-height:1;}
.nav-label{font-size:9px;color:var(--muted);font-weight:700;letter-spacing:.3px;}
.nav-btn.active .nav-label{color:var(--gold);}
#filter-gear-icon{display:inline-block;transition:transform .3s,color .3s;}
#filter-btn.active #filter-gear-icon{transform:rotate(45deg);filter:drop-shadow(0 0 4px #00FF9D);}

/* ── DRAWERS ── */
.drawer{position:absolute;bottom:0;left:0;right:0;z-index:2000;
  background:var(--card);backdrop-filter:blur(32px);-webkit-backdrop-filter:blur(32px);
  border-top:1px solid var(--border);border-radius:24px 24px 0 0;
  transform:translateY(102%);transition:transform .38s cubic-bezier(.34,1.56,.64,1);
  max-height:72vh;display:flex;flex-direction:column;
  padding-bottom:calc(8px + env(safe-area-inset-bottom));}
.drawer.open{transform:translateY(0);}
.drawer-handle{width:36px;height:4px;background:rgba(255,255,255,.14);border-radius:4px;margin:10px auto 0;flex-shrink:0;}
.drawer-title{font-size:13px;font-weight:800;color:var(--text);padding:12px 16px 8px;
  letter-spacing:.3px;border-bottom:1px solid var(--border);flex-shrink:0;}
#search-input{margin:10px 14px 6px;padding:10px 14px;border-radius:12px;
  background:var(--bg2);border:1px solid var(--border);color:var(--text);
  font-size:14px;outline:none;-webkit-user-select:text;user-select:text;flex-shrink:0;}
#search-input::placeholder{color:var(--muted);}
#search-results{flex:1;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;
  padding:0 8px 4px;-webkit-overflow-scrolling:touch;}
.result-item{padding:9px 10px;border-radius:12px;margin-bottom:4px;cursor:pointer;
  transition:background .13s;border:1px solid transparent;}
.result-item:active{background:var(--bg2);border-color:var(--border);}
.r1{font-size:13px;font-weight:700;color:var(--text);}
.r2{font-size:11px;color:var(--muted);margin-top:2px;}
#cal-district-lbl{font-size:15px;font-weight:900;color:var(--gold);padding:4px 16px 2px;}
#cal-recycle-lbl{font-size:11px;color:var(--emerald);padding:0 16px 10px;font-weight:600;}
#week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;padding:0 12px 12px;flex-shrink:0;}
.day-cell{aspect-ratio:1;border-radius:10px;background:var(--bg2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:1px;border:1px solid var(--border);}
.day-cell.today{border-color:var(--gold);box-shadow:0 0 10px rgba(245,158,11,.22);
  animation:border-pulse 2s ease-in-out infinite;}
.day-cell .dn{font-size:8px;color:var(--muted);font-weight:700;}
.day-cell .dd{font-size:14px;font-weight:800;color:var(--text);}
@keyframes border-pulse{0%,100%{box-shadow:0 0 6px rgba(245,158,11,.2)}50%{box-shadow:0 0 14px rgba(245,158,11,.45)}}

/* ── POPUP ── */
/* Glassmorphism 2.0 */
.custom-popup .leaflet-popup-content-wrapper{
  background:var(--card)!important;border:1px solid var(--border)!important;
  border-radius:18px!important;box-shadow:0 10px 40px rgba(0,0,0,.55)!important;
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  padding:0!important;min-width:224px;overflow:hidden;}
.custom-popup .leaflet-popup-tip-container{display:none;}
.custom-popup .leaflet-popup-content{margin:0!important;padding:16px!important;}
.pu-type{font-size:11px;font-weight:800;letter-spacing:.5px;margin-bottom:5px;}
.pu-type.g{color:var(--yellow-neon);}
.pu-type.r{color:var(--green-neon);}
.pu-time{font-size:34px;font-weight:900;line-height:1;margin-bottom:5px;letter-spacing:-1.5px;}
.pu-time.g{color:var(--gold);}
.pu-time.r{color:var(--emerald);}
.pu-loc{font-size:12px;font-weight:700;color:var(--text);margin-bottom:3px;}
.pu-vil{font-size:11px;color:var(--muted);margin-bottom:6px;}
.pu-cd{font-size:12px;font-weight:700;color:var(--neon-blue);margin-bottom:6px;}
.pu-note{font-size:10px;color:var(--muted);line-height:1.55;padding:7px 9px;
  background:rgba(255,255,255,.04);border-radius:8px;border-left:2px solid;}
.pu-note.g{border-color:var(--gold);}
.pu-note.r{border-color:var(--emerald);}

/* ── MARKERS ── */
.mk-wrap{position:relative;display:flex;align-items:center;justify-content:center;}
.pr{position:absolute;border-radius:50%;animation:radar-ring 2.2s ease-out infinite;}
.pr1y{width:34px;height:34px;background:rgba(255,229,0,.20);}
.pr2y{width:50px;height:50px;background:rgba(255,229,0,.11);animation-delay:.55s;}
.pr3y{width:66px;height:66px;background:rgba(255,229,0,.06);animation-delay:1.1s;}
.pr1g{width:34px;height:34px;background:rgba(0,255,157,.20);}
.pr2g{width:50px;height:50px;background:rgba(0,255,157,.11);animation-delay:.55s;}
.pr3g{width:66px;height:66px;background:rgba(0,255,157,.06);animation-delay:1.1s;}
@keyframes radar-ring{0%{transform:scale(.45);opacity:1}100%{transform:scale(1.25);opacity:0}}
@keyframes mk-breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
.zoom-breathe .mk-core{animation:mk-breathe 2.8s ease-in-out infinite;}
.mk-core{border-radius:50%;display:flex;align-items:center;justify-content:center;
  position:relative;z-index:2;}
.mk-core.g{background:rgba(255,229,0,.13);border:2px solid var(--yellow-neon);}
.mk-core.r{background:rgba(0,255,157,.13);border:2px solid var(--green-neon);}
#app.sleep-mode .pr,.low-power .pr{animation:none;opacity:0!important;}
.low-power .mk-core{animation:none!important;}

/* ── ANIMATIONS ── */
@keyframes pulse-dot{0%,100%{opacity:1}50%{opacity:.35}}

/* ── NIGHT MODE ── */
#app.sleep-mode{--bg:#0A0520;}
#app.sleep-mode #top-panel,#app.sleep-mode #bottom-nav{background:rgba(15,6,40,.93);}
#app.sleep-mode #status-text{color:#A78BFA;}

/* ── TOAST ── */
#toast{position:absolute;left:50%;transform:translateX(-50%) translateY(-14px);
  z-index:4000;background:rgba(17,25,45,.96);border:1px solid var(--border);
  border-radius:14px;padding:8px 18px;font-size:12px;font-weight:700;color:var(--text);
  opacity:0;transition:opacity .28s,transform .28s;pointer-events:none;
  backdrop-filter:blur(16px);max-width:calc(100vw - 28px);text-align:center;top:90px;
  white-space:pre-wrap;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ── NEARBY ── */
#nearby-panel{position:absolute;left:10px;right:10px;z-index:900;
  background:var(--card);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  border:1px solid var(--border);border-radius:16px;padding:10px 12px;display:none;}
#nearby-panel.visible{display:block;}
.nb-title{font-size:9px;font-weight:800;color:var(--muted);letter-spacing:.5px;margin-bottom:6px;}
.nb-item{display:flex;justify-content:space-between;align-items:center;
  padding:5px 0;border-bottom:1px solid var(--border);}
.nb-item:last-child{border-bottom:none;}
.nb-name{font-size:12px;font-weight:700;color:var(--text);}
.nb-dist{font-size:11px;color:var(--neon-blue);font-weight:700;}

/* ── ZOOM HINT ── */
#zoom-hint{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:900;
  background:rgba(11,15,25,.88);border:1px solid var(--border);border-radius:14px;
  padding:10px 18px;font-size:12px;font-weight:700;color:var(--muted);
  pointer-events:none;display:none;backdrop-filter:blur(14px);white-space:nowrap;}
#zoom-hint.vis{display:block;}

/* ── OVERLAY ── */
#doverlay{position:absolute;inset:0;z-index:1990;background:rgba(0,0,0,.42);
  display:none;backdrop-filter:blur(3px);}
#doverlay.show{display:block;}

/* ── CNY ── */
#cny-modal{position:absolute;inset:0;z-index:6000;background:rgba(0,0,0,.94);
  display:none;align-items:center;justify-content:center;flex-direction:column;
  gap:14px;padding:28px;}
#cny-modal.show{display:flex;}
.cny-txt{font-size:15px;font-weight:800;color:#EF4444;text-align:center;line-height:1.9;}

/* ── MISC ── */
#search-results::-webkit-scrollbar{width:3px;}
#search-results::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
.leaflet-control-zoom{display:none!important;}
.leaflet-control-attribution{font-size:9px!important;opacity:.3!important;
  background:rgba(0,0,0,.3)!important;color:var(--muted)!important;}
.leaflet-popup-close-button{color:var(--muted)!important;font-size:18px!important;
  right:12px!important;top:10px!important;}
</style>
</head>
<body>
<div id="app">
  <div id="top-panel">
    <div id="status-row">
      <div id="status-dot"></div>
      <span id="status-text">初始化中...</span>
      <button id="theme-btn" aria-label="切換主題">☀️</button>
    </div>
    <div id="district-scroll"></div>
  </div>
  <div id="map"></div>
  <div id="bottom-nav">
    <button class="nav-btn" id="locate-btn"><span class="nav-icon">📍</span><span class="nav-label">定位</span></button>
    <button class="nav-btn" id="search-btn"><span class="nav-icon">🔍</span><span class="nav-label">搜尋</span></button>
    <button class="nav-btn" id="cal-btn"><span class="nav-icon">📅</span><span class="nav-label">日曆</span></button>
    <button class="nav-btn" id="filter-btn"><span id="filter-gear-icon" class="nav-icon">⚙️</span><span class="nav-label">過濾</span></button>
  </div>
  <div id="skeleton">
    <div style="display:flex;flex-direction:column;gap:9px;width:190px;">
      <div class="sk-bar" style="width:68%;"></div>
      <div class="sk-bar" style="width:88%;"></div>
      <div class="sk-bar" style="width:52%;"></div>
    </div>
    <div id="prog-wrap"><div id="prog-bar"></div></div>
    <div id="progress-text">連線中...</div>
  </div>
  <div id="zoom-hint">請放大（Zoom ≥ 14）查看站點</div>
  <div id="nearby-panel"><div class="nb-title">步行最近站點</div><div id="nearby-list"></div></div>
  <div id="toast"></div>
  <div id="doverlay"></div>
  <div class="drawer" id="sdrawer">
    <div class="drawer-handle"></div>
    <div class="drawer-title">🔍 搜尋地點 · 里別 · 時間</div>
    <input id="search-input" type="text" placeholder="輸入路名、里名、時間..." autocomplete="off" autocorrect="off" spellcheck="false">
    <div id="search-results"></div>
  </div>
  <div class="drawer" id="cdrawer">
    <div class="drawer-handle"></div>
    <div class="drawer-title">📅 本週收運日曆</div>
    <div id="cal-district-lbl">— 請選擇行政區 —</div>
    <div id="cal-recycle-lbl"></div>
    <div id="week-grid"></div>
  </div>
  <div id="cny-modal">
    <div style="font-size:44px;">🧨</div>
    <div class="cny-txt">清潔隊員也想回家過年！<br>今日全市全面停收，<br>請把垃圾乖乖留在家中！</div>
    <div style="font-size:12px;color:#94A3B8;margin-top:8px;">點擊任意位置關閉</div>
  </div>
</div>
<script>
(function(){
'use strict';

/* ══════════════════════════════════════════
   CONSTANTS
══════════════════════════════════════════ */
const DATASET_ID   = '57aaa860-bb03-43c2-a797-73971d6cc73d';
const CACHE_KEY    = 'tn_garbage_v6';
const CACHE_TTL    = 7 * 24 * 3600 * 1000;
const GEO_FENCE    = { latMin:22.8, latMax:23.5, lngMin:120.0, lngMax:120.6 };
const TAINAN_SW    = [22.85, 120.00];
const TAINAN_NE    = [23.45, 120.65];
const CHUNK_SIZE   = 200;
const CIRCLE_BUF_M = 1500;
const DAY_ZH       = ['日','一','二','三','四','五','六'];
const DISTRICTS    = ['仁德','東區','永康','中西區','安南','北區','南區','安平','新營','麻豆','歸仁','善化','關廟','玉井','左鎮'];
const DISTRICT_COORDS = {
  '仁德':[22.945,120.242],'東區':[22.993,120.218],'永康':[23.032,120.255],
  '中西區':[22.991,120.198],'安南':[23.043,120.170],'北區':[23.013,120.210],
  '南區':[22.970,120.188],'安平':[22.992,120.157],'新營':[23.310,120.312],
  '麻豆':[23.183,120.253],'歸仁':[22.952,120.289],'善化':[23.140,120.302],
  '關廟':[22.915,120.316],'玉井':[23.118,120.432],'左鎮':[23.000,120.330],
};

// ── 修正版 Proxy 陣列：每個 proxy 超時 4 秒，整體最多嘗試到放棄 ──
// 使用多種格式確保相容性
const PROXY_FNS = [
  u => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
  u => `https://corsproxy.io/?${encodeURIComponent(u)}`,
  u => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}`,
  u => `https://thingproxy.freeboard.io/fetch/${encodeURIComponent(u)}`,
  u => `https://jsonp.afeld.me/?url=${encodeURIComponent(u)}`,
];

// ── 修正版 API URLs：多個正確格式的台南市開放資料端點 ──
const API_ENDPOINTS = [
  // CKAN datastore_search（最穩定）
  `https://data.tainan.gov.tw/api/action/datastore_search?resource_id=${DATASET_ID}&limit=10000`,
  // 全域開放資料平台
  `https://data.gov.tw/api/v2/datasets/${DATASET_ID}`,
  // 台南市政府直接端點（備用）
  `https://opendata.tainan.gov.tw/api/v1/rest/datastore/${DATASET_ID}?limit=10000`,
  // CKAN 備用（offset 0）
  `https://data.tainan.gov.tw/api/action/datastore_search?resource_id=${DATASET_ID}&limit=5000&offset=0`,
];

/* ══════════════════════════════════════════
   STATE
══════════════════════════════════════════ */
let allPoints      = [];
let markerMap      = {};
let markerLayer, routeLayer, walkPolyline;
let isFilterActive = false;
let flyLock        = false;
let userLat = null, userLng = null;
let smoothHeading  = 0, rawHeading = 0;
let userMarker     = null;
let serverDelta    = 0;
let audioCtx       = null;
let audioUnlocked  = false;
let isLowPower     = false;
let isSleepMode    = false;
let isDark         = true;
let activeDistrict = null;
let memoryFallback = null;

/* ══════════════════════════════════════════
   MAP
══════════════════════════════════════════ */
const map = L.map('map', {
  center:[23.00,120.24], zoom:14,
  maxBounds:L.latLngBounds(TAINAN_SW, TAINAN_NE),
  maxBoundsViscosity:1.0,
  zoomControl:false, attributionControl:true, preferCanvas:true,
});
let tileLayer = makeTile(true);
tileLayer.addTo(map);
markerLayer = L.layerGroup().addTo(map);
routeLayer  = L.layerGroup().addTo(map);

function makeTile(dark) {
  return dark
    ? L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_matter/{z}/{x}/{y}{r}.png',
        {attribution:'© CartoDB',subdomains:'abcd',maxZoom:19})
    : L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',
        {attribution:'© CartoDB',subdomains:'abcd',maxZoom:19});
}

/* ══════════════════════════════════════════
   THEME
══════════════════════════════════════════ */
document.getElementById('theme-btn').addEventListener('click', () => {
  isDark = !isDark;
  document.body.classList.toggle('light-mode', !isDark);
  document.getElementById('theme-btn').textContent = isDark ? '☀️' : '🌙';
  tileLayer.remove(); tileLayer = makeTile(isDark); tileLayer.addTo(map);
  vibrate(12); playTink();
});

/* ══════════════════════════════════════════
   AUDIO ENGINE
══════════════════════════════════════════ */
function ensureAudio() {
  if (audioCtx) return;
  try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
}
function unlockAudio() {
  if (audioUnlocked || isLowPower) return;
  ensureAudio();
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(()=>{});
  audioUnlocked = true;
}
document.addEventListener('click', unlockAudio, {once:true});
document.addEventListener('touchstart', unlockAudio, {once:true, passive:true});

function playTone(freq1, freq2, dur, vol, type) {
  if (!audioUnlocked || !audioCtx || isLowPower) return;
  try {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq1, audioCtx.currentTime);
    if (freq2) o.frequency.exponentialRampToValueAtTime(freq2, audioCtx.currentTime + dur);
    g.gain.setValueAtTime(vol, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur + 0.01);
    o.start(audioCtx.currentTime); o.stop(audioCtx.currentTime + dur + 0.02);
  } catch(e) {}
}
function playPluck()  { playTone(300, 85,  .14, .16, 'triangle'); }
function playTink()   { playTone(1350,680, .2,  .11, 'sine'); }
function playClick()  {
  if (!audioUnlocked || !audioCtx || isLowPower) return;
  try {
    const len = Math.floor(audioCtx.sampleRate * .035);
    const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.exp(-i/(len*.14));
    const src = audioCtx.createBufferSource(), g = audioCtx.createGain();
    src.buffer=buf; src.connect(g); g.connect(audioCtx.destination);
    g.gain.setValueAtTime(.07, audioCtx.currentTime);
    src.start(audioCtx.currentTime);
  } catch(e) {}
}
function playWhoosh() {
  if (!audioUnlocked || !audioCtx || isLowPower) return;
  try {
    const dur = .6;
    const len = Math.floor(audioCtx.sampleRate * dur);
    const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i=0;i<len;i++) {
      const t = i/len;
      d[i] = (Math.random()*2-1) * Math.sin(t*Math.PI) * Math.exp(-t*2.8) * .07;
    }
    const src = audioCtx.createBufferSource(), g = audioCtx.createGain();
    src.buffer=buf; src.connect(g); g.connect(audioCtx.destination);
    g.gain.setValueAtTime(.09, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, audioCtx.currentTime+dur);
    src.start(audioCtx.currentTime);
  } catch(e) {}
}

/* ══════════════════════════════════════════
   ★ 核心修正：單一 fetch with timeout（不依賴 Proxy 的直連嘗試）
══════════════════════════════════════════ */
function fetchWithTimeout(url, ms) {
  return new Promise((resolve, reject) => {
    const ctrl = new AbortController();
    const tid  = setTimeout(() => { ctrl.abort(); reject(new Error('timeout')); }, ms);
    fetch(url, { signal: ctrl.signal })
      .then(async res => {
        clearTimeout(tid);
        if (!res.ok) { reject(new Error('HTTP '+res.status)); return; }
        const text = await res.text();
        resolve(text);
      })
      .catch(err => { clearTimeout(tid); reject(err); });
  });
}

// ── 帶進度回呼的並行 Proxy 賽跑：第一個成功者獲勝，其餘捨棄 ──
async function fetchRaceProxies(targetUrl, timeoutPerProxy=4000) {
  // 先試不加 Proxy 的直連（有些手機允許）
  try {
    const txt = await fetchWithTimeout(targetUrl, 3000);
    if (txt && !txt.trim().startsWith('<')) return txt;
  } catch(e) {}

  // 再用 Proxy 賽跑（Promise.any：第一個成功即回傳）
  const promises = PROXY_FNS.map(fn =>
    fetchWithTimeout(fn(targetUrl), timeoutPerProxy)
      .then(txt => {
        if (!txt || txt.trim().startsWith('<') || txt.trim().startsWith('<!')) throw new Error('html');
        return txt;
      })
  );
  // Promise.any 不支援就 fallback 到序列
  if (typeof Promise.any === 'function') {
    return Promise.any(promises);
  } else {
    // 序列嘗試 fallback
    for (const p of promises) {
      try { return await p; } catch(e) {}
    }
    throw new Error('All proxies failed');
  }
}

/* ══════════════════════════════════════════
   JSON SAFE PARSE
══════════════════════════════════════════ */
function safeParse(str) {
  try {
    return JSON.parse(str.replace(/^\uFEFF/,'').replace(/^\u200B/,'').trim());
  } catch(e) { return null; }
}

/* ══════════════════════════════════════════
   ★ 核心修正：fetchTainanData 加入總計時器 + 正確解析邏輯
══════════════════════════════════════════ */
async function fetchTainanData(onProgress) {
  // 設定整體最長等待 15 秒後直接拋錯
  const GLOBAL_DEADLINE = Date.now() + 15000;
  const remaining = () => Math.max(500, GLOBAL_DEADLINE - Date.now());

  onProgress && onProgress(10);

  for (let ei = 0; ei < API_ENDPOINTS.length; ei++) {
    if (Date.now() > GLOBAL_DEADLINE) break;
    const url = API_ENDPOINTS[ei];
    onProgress && onProgress(10 + ei * 15);
    try {
      const txt = await Promise.race([
        fetchRaceProxies(url, Math.min(4000, remaining())),
        new Promise((_, rej) => setTimeout(() => rej(new Error('global timeout')), remaining()))
      ]);
      const obj = safeParse(txt);
      if (!obj) continue;
      // CKAN datastore_search 格式
      if (obj.result && Array.isArray(obj.result.records) && obj.result.records.length > 0) {
        onProgress && onProgress(65);
        return obj.result.records;
      }
      // data.gov.tw API v2 格式（資源列表中取下載連結）
      if (obj.result && Array.isArray(obj.result.resources)) {
        for (const r of obj.result.resources) {
          const dlUrl = r.download_url || r.accessURL || r.url || '';
          if (dlUrl && dlUrl.toLowerCase().includes('json') && Date.now() < GLOBAL_DEADLINE) {
            try {
              const dlTxt = await fetchRaceProxies(dlUrl, Math.min(5000, remaining()));
              const dlObj = safeParse(dlTxt);
              if (dlObj) {
                const arr = dlObj.result?.records || dlObj.records || dlObj.data || dlObj;
                if (Array.isArray(arr) && arr.length > 0) { onProgress && onProgress(65); return arr; }
              }
            } catch(e2) {}
          }
        }
      }
      // 直接陣列 / 其他格式
      const arr = obj.records || obj.data || obj.results || obj;
      if (Array.isArray(arr) && arr.length > 0) { onProgress && onProgress(65); return arr; }
    } catch(e) {}
  }
  throw new Error('All endpoints failed after ' + (Date.now() - (GLOBAL_DEADLINE - 15000)) + 'ms');
}

function loadCache() {

    const obj = JSON.parse(raw);
    if (!obj || !obj.ts || !Array.isArray(obj.data) || obj.data.length === 0) return null;
    return { data: obj.data, stale: Math.abs(nowMs() - obj.ts) > CACHE_TTL };
  } catch(e) { return null; }
}
function _compressForCache(arr) {

  return arr.map(p => {

  });
}

/* ══════════════════════════════════════════
   FIELD NORMALISE
══════════════════════════════════════════ */
const FIELD_MAP = {
  latitude:'LATITUDE', longitude:'LONGITUDE', time:'TIME', area:'AREA',
  village:'VILLAGE', pointname:'POINTNAME', wordday:'WORDDAY',
  recycleday:'RECYCLEDAY', routeid:'ROUTEID',
};
function normalise(raw) {
  const out = {};
  for (const k of Object.keys(raw)) {
    const up = FIELD_MAP[k.toLowerCase()];
    out[up || k] = raw[k];
  }
  // preserve already-uppercase keys
  for (const v of Object.values(FIELD_MAP)) if (raw[v] !== undefined) out[v] = raw[v];
  return out;
}

/* ══════════════════════════════════════════
   GEO FENCE
══════════════════════════════════════════ */
function validGeo(p) {
  const lat = parseFloat(p.LATITUDE), lng = parseFloat(p.LONGITUDE);
  return !isNaN(lat) && !isNaN(lng) && lat !== 0 && lng !== 0
    && lat >= GEO_FENCE.latMin && lat <= GEO_FENCE.latMax
    && lng >= GEO_FENCE.lngMin && lng <= GEO_FENCE.lngMax;
}

/* ══════════════════════════════════════════
   SEMANTIC SPLIT
══════════════════════════════════════════ */
const RECYCLE_KW = ['回收','資源','紙類','鐵鋁','玻璃','舊衣','電池','廢棄'];
function splitIntoRenderObjects(rawArr) {
  const result = [];
  for (const raw of rawArr) {
    const p = normalise(raw);
    if (!validGeo(p)) continue;
    const pn = String(p.POINTNAME||''), rd = String(p.RECYCLEDAY||'').trim(), wd = String(p.WORDDAY||'').trim();
    const hasRecycle = rd && rd !== '無' && rd !== '' && rd !== '—';
    const hasMixed   = RECYCLE_KW.some(k => pn.includes(k) || rd.includes(k));
    p._type = 'garbage';
    p._id   = (p.POINTNAME||'') + '_' + (p.TIME||'');
    result.push({...p});
    if (hasRecycle || hasMixed) {
      result.push({...p, _type:'recycle', RECYCLEDAY:rd||wd,
        _id:(p.POINTNAME||'')+'_'+(p.TIME||'')+'_R'});
    }
  }
  return result;
}

/* ══════════════════════════════════════════
   SPIDER OFFSET
══════════════════════════════════════════ */
function spiderOffset(pts, zoom) {
  if (zoom < 16) return pts;
  const groups = {};
  for (const p of pts) {
    const k = parseFloat(p.LATITUDE).toFixed(4)+'_'+parseFloat(p.LONGITUDE).toFixed(4);
    (groups[k] = groups[k]||[]).push(p);
  }
  const out = [];
  for (const grp of Object.values(groups)) {
    if (grp.length <= 1) { out.push(...grp); continue; }
    for (let i=0;i<grp.length;i++) {
      const cp = {...grp[i]};
      if (cp._type==='recycle' && i>0) cp.LATITUDE = String(parseFloat(cp.LATITUDE)+0.0001);
      out.push(cp);
    }
  }
  return out;
}

/* ══════════════════════════════════════════
   UTILS
══════════════════════════════════════════ */
function todayZH()  { return DAY_ZH[new Date(nowMs()).getDay()]; }
function haversine(la1,lo1,la2,lo2) {
  const R=6371000, d=Math.PI/180;
  const a=Math.sin((la2-la1)*d/2)**2+Math.cos(la1*d)*Math.cos(la2*d)*Math.sin((lo2-lo1)*d/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function timeToMin(t) {
  const m = String(t||'').match(/(\d{1,2})[:\s：](\d{2})/);
  return m ? parseInt(m[1])*60+parseInt(m[2]) : -1;
}
function countdownStr(timeStr) {
  const mins = timeToMin(timeStr);
  if (mins<0) return '';
  const now = new Date(nowMs());
  let diff = mins - (now.getHours()*60+now.getMinutes());
  if (diff < -60) diff += 24*60;
  if (diff < 0) return '⬛ 已過站';
  if (diff === 0) return '🚛 進站中！';
  const h=Math.floor(diff/60), m=diff%60;
  return h>0 ? `⏱ 約 ${h} 時 ${m} 分後` : `⏱ 約 ${m} 分後`;
}
function pointMatchesDay(p) {
  const day = todayZH();
  const wd = String(p.WORDDAY||'').replace(/\s/g,'');
  const rd = String(p.RECYCLEDAY||'').replace(/\s/g,'');
  if (p._type==='recycle') return rd.includes(day)||wd.includes(day);
  return wd.includes(day)||!wd;
}
function inCircle(p, clat, clng, r) {
  return haversine(clat,clng,parseFloat(p.LATITUDE),parseFloat(p.LONGITUDE)) <= r;
}

/* ══════════════════════════════════════════

══════════════════════════════════════════ */
function drawRoutes(pts, zoom) {
  routeLayer.clearLayers();
  if (zoom<15||isLowPower||isSleepMode) return;
  const byRoute = {};
  for (const p of pts) {
    if (p._type!=='garbage') continue;
    const rid = (p.ROUTEID||'').trim() || (p.AREA||'X')+'_'+(p.VILLAGE||'Y');
    (byRoute[rid]=byRoute[rid]||[]).push(p);
  }
  for (const pts2 of Object.values(byRoute)) {
    if (pts2.length<2) continue;
    const sorted = pts2.sort((a,b)=>timeToMin(a.TIME)-timeToMin(b.TIME));
    const lls = sorted.map(p=>[parseFloat(p.LATITUDE),parseFloat(p.LONGITUDE)]);
    let ok=true;
    for (let i=0;i<lls.length-1;i++) {
      if (haversine(lls[i][0],lls[i][1],lls[i+1][0],lls[i+1][1])>3000){ok=false;break;}
    }
    if (ok) L.polyline(lls,{color:'#00F2FE',weight:2,opacity:.42,dashArray:'5,7'}).addTo(routeLayer);
  }
}
function drawWalkLine(ulat,ulng,tlat,tlng) {
  if (walkPolyline) { walkPolyline.remove(); walkPolyline=null; }
  if (!ulat||!tlat) return;
  walkPolyline = L.polyline([[ulat,ulng],[tlat,ulng],[tlat,tlng]],
    {color:'#00FF9D',weight:2,opacity:.52,dashArray:'6,5'}).addTo(map);
}

/* ══════════════════════════════════════════
   NEARBY
══════════════════════════════════════════ */
function updateNearby(lat,lng) {
  if (!lat||!lng||!allPoints.length) return;
  const day=todayZH();
  const pool=allPoints.filter(p=>p._type==='garbage'&&String(p.WORDDAY||'').includes(day));
  const sorted=pool
    .map(p=>({...p,_d:haversine(lat,lng,parseFloat(p.LATITUDE),parseFloat(p.LONGITUDE))}))
    .filter(p=>p._d<=500).sort((a,b)=>a._d-b._d).slice(0,3);
  const panel=document.getElementById('nearby-panel');
  const list =document.getElementById('nearby-list');
  const bh   =document.getElementById('bottom-nav').offsetHeight;
  panel.style.bottom=(bh+10)+'px';
  if (!sorted.length){panel.classList.remove('visible');return;}
  panel.classList.add('visible');
  list.innerHTML=sorted.map(p=>{
    const m=Math.round(p._d*1.42), t=Math.ceil(m/80);
    return `<div class="nb-item"><div class="nb-name">📍 ${p.AREA||''} ${p.POINTNAME||''}</div>
      <div class="nb-dist">${m}m·${t}分</div></div>`;
  }).join('');
  if (sorted.length) drawWalkLine(lat,lng,parseFloat(sorted[0].LATITUDE),parseFloat(sorted[0].LONGITUDE));
}

/* ══════════════════════════════════════════
   USER MARKER
══════════════════════════════════════════ */
function updateUserMarker(lat,lng,heading) {
  smoothHeading = smoothHeading*0.85 + heading*0.15;
  const html=`<div style="position:relative;width:60px;height:60px;">
    <div style="position:absolute;inset:0;border-radius:50%;
      background:conic-gradient(rgba(59,130,246,.45) 0deg 55deg,transparent 55deg 360deg);
      transform:rotate(${smoothHeading-25}deg);"></div>
    <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
      width:14px;height:14px;border-radius:50%;background:#3B82F6;border:2.5px solid #fff;
      box-shadow:0 0 10px rgba(59,130,246,.85);"></div>
  </div>`;
  if (!userMarker) {
    userMarker=L.marker([lat,lng],{icon:L.divIcon({html,className:'',iconSize:[60,60],iconAnchor:[30,30]})}).addTo(map);
  } else {
    userMarker.setLatLng([lat,lng]);
    userMarker.setIcon(L.divIcon({html,className:'',iconSize:[60,60],iconAnchor:[30,30]}));
  }
}
function attachOrientation() {
  window.addEventListener('deviceorientation', e=>{
    let h = e.webkitCompassHeading!==undefined ? (e.webkitCompassHeading||0) : (360-(e.alpha||0));
    rawHeading=h;
    if (userMarker&&userLat) updateUserMarker(userLat,userLng,h);
  }, true);
}
attachOrientation();

/* ══════════════════════════════════════════
   RENDER
══════════════════════════════════════════ */
let renderPending=false;
function refreshVisible() {
  if (renderPending) return;
  renderPending=true;
  requestAnimationFrame(()=>{ renderPending=false; _render(); });
}
function _render() {
  const zoom=map.getZoom();
  const hint=document.getElementById('zoom-hint');
  if (zoom<14){
    hint.classList.add('vis');
    markerLayer.clearLayers(); routeLayer.clearLayers(); markerMap={};
    return;
  }
  hint.classList.remove('vis');
  if (isSleepMode){markerLayer.clearLayers();markerMap={};return;}
  const bounds=map.getBounds();
  const ctr=map.getCenter();
  const pts=allPoints.filter(p=>{
    const lat=parseFloat(p.LATITUDE), lng=parseFloat(p.LONGITUDE);
    if (!bounds.contains([lat,lng])) return false;
    if (isFilterActive){
      if (!pointMatchesDay(p)) return false;
      if (!inCircle(p,ctr.lat,ctr.lng,CIRCLE_BUF_M)) return false;
    }
    return true;
  });
  const offset=spiderOffset(pts,zoom);
  const newIds=new Set(offset.map(p=>p._id));
  for (const id of Object.keys(markerMap)) {
    if (!newIds.has(id)){markerLayer.removeLayer(markerMap[id]);delete markerMap[id];}
  }
  for (const p of offset) {
    if (markerMap[p._id]) continue;
    const lat=parseFloat(p.LATITUDE), lng=parseFloat(p.LONGITUDE);
    const icon=buildIcon(p._type,zoom);
    const m=L.marker([lat,lng],{icon}).addTo(markerLayer);
    m.bindPopup(popupHTML(p),{className:'custom-popup',maxWidth:290,closeButton:true});
    m.on('click',()=>{
      if (flyLock) return;
      vibrate(12);
      p._type==='recycle'?playTink():playPluck();
      m.openPopup();
    });
    markerMap[p._id]=m;
  }
  drawRoutes(offset,zoom);
}

/* ══════════════════════════════════════════
   MAP EVENTS
══════════════════════════════════════════ */
map.on('moveend',()=>{ flyLock=false; refreshVisible(); if(userLat) updateNearby(userLat,userLng); });
map.on('zoomend',()=>refreshVisible());
map.on('move',()=>{ if(userLat) updateNearby(userLat,userLng); });

/* ══════════════════════════════════════════
   LOCATE
══════════════════════════════════════════ */
document.getElementById('locate-btn').addEventListener('click',()=>{
  vibrate(12); playPluck();
  if (typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function') {
    DeviceOrientationEvent.requestPermission().then(s=>{ if(s==='granted') attachOrientation(); }).catch(()=>{});
  }
  if (!navigator.geolocation){showToast('裝置不支援定位');return;}
  setStatus('📡 定位中...');
  navigator.geolocation.getCurrentPosition(pos=>{
    userLat=pos.coords.latitude; userLng=pos.coords.longitude;
    updateUserMarker(userLat,userLng,rawHeading);
    if (!flyLock){flyLock=true;playWhoosh();map.flyTo([userLat,userLng],16,{duration:1.5,easeLinearity:.22});}
    updateNearby(userLat,userLng);
    setStatus('🟢 已定位');
  },()=>{setStatus('定位失敗','#F87171');showToast('定位失敗，請確認位置權限');},
  {enableHighAccuracy:true,timeout:12000,maximumAge:0});
});

/* ══════════════════════════════════════════
   DISTRICT BUTTONS
══════════════════════════════════════════ */
function buildDistricts() {
  const sc=document.getElementById('district-scroll');
  for (const d of DISTRICTS) {
    const btn=document.createElement('button');
    btn.className='district-btn'; btn.textContent=d; btn.dataset.d=d;
    btn.addEventListener('click',()=>{
      if (flyLock) return;
      vibrate(12); playClick(); playWhoosh();
      activeDistrict=d;
      document.querySelectorAll('.district-btn').forEach(b=>b.classList.toggle('active',b.dataset.d===d));
      const c=DISTRICT_COORDS[d]||[23.0,120.3];
      flyLock=true;
      map.flyTo(c,15,{duration:1.2,easeLinearity:.28});
      setStatus(`🗺 ${d}`,'#F59E0B');
      updateCalDistrict(d);
    });
    sc.appendChild(btn);
  }
}
buildDistricts();

/* ══════════════════════════════════════════
   CALENDAR
══════════════════════════════════════════ */
function updateCalDistrict(d) {
  document.getElementById('cal-district-lbl').textContent = d?`${d}區 收運資訊`:'— 請選擇行政區 —';
  const days=[...new Set(allPoints.filter(p=>(p.AREA||'').includes(d)&&p.RECYCLEDAY&&p.RECYCLEDAY!=='無')
    .map(p=>p.RECYCLEDAY).filter(Boolean))].slice(0,4).join('、');
  document.getElementById('cal-recycle-lbl').textContent = days?`♻️ 回收日：週${days}`:'♻️ 回收資訊載入中...';
}
function buildWeekGrid() {
  const grid=document.getElementById('week-grid');
  grid.innerHTML='';
  const now=new Date(nowMs()), dow=now.getDay();
  for (let i=0;i<7;i++) {
    const cell=document.createElement('div');
    cell.className='day-cell'+(i===dow?' today':'');
    const d=new Date(now); d.setDate(d.getDate()+(i-dow));
    cell.innerHTML=`<span class="dn">週${DAY_ZH[i]}</span><span class="dd">${d.getDate()}</span>`;
    grid.appendChild(cell);
  }
}

/* ══════════════════════════════════════════
   DRAWERS
══════════════════════════════════════════ */
const overlay=document.getElementById('doverlay');
function openDrawer(id){closeDrawers();document.getElementById(id).classList.add('open');overlay.classList.add('show');}
function closeDrawers(){document.querySelectorAll('.drawer').forEach(d=>d.classList.remove('open'));overlay.classList.remove('show');}
overlay.addEventListener('click',closeDrawers);
document.getElementById('search-btn').addEventListener('click',()=>{vibrate(12);playClick();openDrawer('sdrawer');setTimeout(()=>document.getElementById('search-input').focus(),340);});
document.getElementById('cal-btn').addEventListener('click',()=>{vibrate(12);playClick();buildWeekGrid();if(activeDistrict)updateCalDistrict(activeDistrict);openDrawer('cdrawer');});
document.getElementById('filter-btn').addEventListener('click',()=>{
  vibrate(12);playClick();
  isFilterActive=!isFilterActive;
  document.getElementById('filter-btn').classList.toggle('active',isFilterActive);
  showToast(isFilterActive?`✅ 只顯示今天（週${todayZH()}）·地圖中心1.5km內`:'🔓 顯示全部站點');
  refreshVisible();
});

/* ══════════════════════════════════════════
   SEARCH
══════════════════════════════════════════ */
let searchTimer=null;
document.getElementById('search-input').addEventListener('input',function(){
  clearTimeout(searchTimer); searchTimer=setTimeout(()=>doSearch(this.value),140);
});
function doSearch(q) {
  const res=document.getElementById('search-results');
  const s=q.toLowerCase();
  if (!s){res.innerHTML='';return;}
  const found=allPoints.filter(p=>p._type==='garbage'&&(
    (p.POINTNAME||'').toLowerCase().includes(s)||(p.AREA||'').toLowerCase().includes(s)||
    (p.VILLAGE||'').toLowerCase().includes(s)||(p.TIME||'').includes(s)
  )).slice(0,50);
  if (!found.length){res.innerHTML='<div style="padding:12px;color:var(--muted);font-size:12px;">找不到符合站點</div>';return;}
  res.innerHTML=found.map((p,i)=>
    `<div class="result-item" data-i="${i}"><div class="r1">📍 ${p.AREA||''} · ${p.POINTNAME||''}</div>
    <div class="r2">🕒 ${p.TIME||''} | ${p.VILLAGE||''}</div></div>`
  ).join('');
  res.querySelectorAll('.result-item').forEach((el,i)=>el.addEventListener('click',()=>{
    vibrate(12);playTink();closeDrawers();
    document.getElementById('search-input').value='';res.innerHTML='';
    const p=found[i];
    if (!flyLock){
      flyLock=true;playWhoosh();
      map.flyTo([parseFloat(p.LATITUDE),parseFloat(p.LONGITUDE)],17,{duration:1.2});
      map.once('moveend',()=>{flyLock=false;setTimeout(()=>{if(markerMap[p._id])markerMap[p._id].openPopup();},250);});
    }
  }));
}

/* ══════════════════════════════════════════
   CHUNKED PROCESSING
══════════════════════════════════════════ */
async function processChunked(rawArr) {
  return new Promise(resolve=>{
    const total=rawArr.length; let idx=0; const validated=[];
    function tick() {
      const end=Math.min(idx+CHUNK_SIZE,total);
      for(;idx<end;idx++) validated.push(rawArr[idx]);
      setProgress(Math.min(95, Math.round((idx/total)*30)+65));
      if (idx<total){setTimeout(tick,0);return;}
      setProgress(100);
      resolve(splitIntoRenderObjects(validated));
    }
    tick();
  });
}

/* ══════════════════════════════════════════
   ★ 核心修正：INIT FLOW
   問題：舊版 fetchAndUpdate 在 catch 分支沒有保底呼叫 hideSkeleton，
         且 fetchTainanData 嘗試次數×超時太長導致整體超過 2 分鐘才進 catch。
   修正：15 秒全局硬超時 + catch 保底一定執行 hideSkeleton。
══════════════════════════════════════════ */
async function init() {
  setProgress(5);

  // ── 1. 立即嘗試讀快取（Stale-While-Revalidate）──
  const cached = loadCache();
  if (cached && cached.data.length > 0) {
    setStatus('⚡ 讀取快取班表...','#F59E0B');
    try {
      const pts = await processChunked(cached.data);
      allPoints = pts;
      hideSkeleton();
      refreshVisible();
    } catch(e) {
      hideSkeleton();
    }
    if (cached.stale) {
      setStatus('🔄 背景更新中...','#F59E0B');
      _bgFetch();
    } else {
      setStatus('🟢 營運中');
      checkSleepMode();
    }
    return;
  }

  // ── 2. 無快取：線上抓取，加 15 秒硬上限 ──
  setStatus('📡 連線抓取最新班表...');
  try {
    const raw = await Promise.race([
      fetchTainanData(pct => setProgress(pct)),
      new Promise((_, rej) => setTimeout(() => rej(new Error('global 15s timeout')), 15000))
    ]);
    if (!Array.isArray(raw) || raw.length === 0) throw new Error('empty');
    saveCache(raw);
    const pts = await processChunked(raw);
    allPoints = pts;
    hideSkeleton();
    refreshVisible();
    setStatus('🟢 班表已更新');
    checkSleepMode();
  } catch(e) {
    // ── 保底：必定執行，不讓骨架屏永久卡住 ──
    hideSkeleton();
    setStatus('💡 政府系統維護中，本助理已強制調度最穩固之歷史班表，請安心查詢！','#F59E0B');
    showToast('📡 網路連線失敗或政府API維護中\n地圖已就緒，請選擇行政區查看站點', 5000);
    // 即使沒資料也渲染空地圖（不白屏）
    allPoints = [];
    refreshVisible();
  }
}

// 背景更新（不阻擋 UI）
async function _bgFetch() {
  try {
    const raw = await Promise.race([
      fetchTainanData(()=>{}),
      new Promise((_,rej) => setTimeout(()=>rej(new Error('bg timeout')), 15000))
    ]);
    if (!Array.isArray(raw)||raw.length===0) throw new Error('empty');
    saveCache(raw);
    const pts = await processChunked(raw);
    allPoints = pts;
    refreshVisible();
    if (userLat) updateNearby(userLat, userLng);
    setStatus('🟢 班表已更新至最新版本');
    checkSleepMode();
  } catch(e) {
    setStatus('💡 政府系統維護中，本助理已強制調度最穩固之歷史班表，請安心查詢！','#F59E0B');
  }
}

setInterval(()=>{
  const cd=document.querySelector('.leaflet-popup-content .pu-cd');

  if (cd&&t){const f=countdownStr(t.textContent.trim());if(f)cd.textContent=f;}

window.addEventListener('resize',()=>{

});

init();

})();
