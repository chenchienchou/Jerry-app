<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>台南垃圾車即時班表</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none;}
:root{
  --bg:#0B0F19;--bg2:#111827;--gold:#F59E0B;--gold10:rgba(245,158,11,0.10);
  --emerald:#10B981;--neon-blue:#00F2FE;--panel:rgba(17,24,39,0.88);
  --border:rgba(245,158,11,0.12);--text:#F1F5F9;--muted:#94A3B8;
  --yellow-neon:#FFE500;--green-neon:#00FF9D;
  --card:rgba(11,17,30,0.93);--radius:16px;
}
.light-mode{
  --bg:#F0F4F8;--bg2:#E2E8F0;--gold:#D97706;--panel:rgba(240,244,248,0.93);
  --border:rgba(37,99,235,0.14);--text:#1E293B;--muted:#64748B;
  --card:rgba(255,255,255,0.96);--yellow-neon:#C47F00;--green-neon:#059669;
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',system-ui,sans-serif;}
#app{display:flex;flex-direction:column;width:100%;height:100dvh;
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);}

/* ── TOP PANEL ── */
#top-panel{
  position:relative;z-index:1000;padding:10px 14px 8px;
  background:var(--panel);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-bottom:1px solid var(--border);flex-shrink:0;
}
#status-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
#status-dot{width:8px;height:8px;border-radius:50%;background:var(--emerald);
  flex-shrink:0;animation:pulse-dot 2s ease-in-out infinite;}
#status-text{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.4px;flex:1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#theme-btn{width:30px;height:30px;border-radius:50%;background:var(--bg2);
  border:1px solid var(--border);cursor:pointer;display:flex;align-items:center;
  justify-content:center;font-size:14px;flex-shrink:0;transition:transform .2s;}
#theme-btn:active{transform:scale(.88);}
#district-scroll{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;touch-action:pan-x;overscroll-behavior-x:contain;}
#district-scroll::-webkit-scrollbar{display:none;}
.district-btn{
  flex-shrink:0;padding:5px 12px;border-radius:20px;font-size:11px;font-weight:700;
  background:var(--bg2);border:1px solid var(--border);color:var(--muted);
  cursor:pointer;transition:all .18s;white-space:nowrap;letter-spacing:.3px;
  -webkit-tap-highlight-color:transparent;
}
.district-btn.active,.district-btn:active{background:var(--gold);color:#000;border-color:var(--gold);}

/* ── SKELETON ── */
#skeleton{
  position:absolute;inset:0;z-index:500;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  transition:opacity .7s ease;pointer-events:none;
}
#skeleton.hidden{opacity:0;}
.sk-bar{height:13px;border-radius:7px;
  background:linear-gradient(90deg,rgba(255,255,255,.04) 0%,rgba(255,255,255,.13) 45%,rgba(255,255,255,.04) 90%);
  background-size:200% 100%;animation:shimmer 1.7s infinite;}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
#progress-text{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.4px;}
#prog-wrap{width:150px;height:3px;background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden;}
#prog-bar{height:100%;width:0%;background:linear-gradient(90deg,var(--gold),var(--neon-blue));
  border-radius:3px;transition:width .25s ease;}

/* ── MAP ── */
#map{flex:1;z-index:1;position:relative;}
.leaflet-container{background:#090D16!important;}
.light-mode .leaflet-container{background:#E8EEF4!important;}
.leaflet-pane.leaflet-shadow-pane{mix-blend-mode:plus-lighter;}
.leaflet-pane.leaflet-overlay-pane{mix-blend-mode:normal;}

/* ── BOTTOM NAV ── */
#bottom-nav{
  display:flex;align-items:center;justify-content:space-around;
  padding:6px 0 calc(6px + env(safe-area-inset-bottom));
  background:var(--panel);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-top:1px solid var(--border);z-index:1000;flex-shrink:0;
}
.nav-btn{
  display:flex;flex-direction:column;align-items:center;gap:2px;
  width:52px;height:52px;border-radius:14px;border:none;background:none;
  cursor:pointer;transition:transform .15s;justify-content:center;
  -webkit-tap-highlight-color:transparent;
}
.nav-btn:active{transform:scale(.85);}
.nav-icon{font-size:21px;line-height:1;}
.nav-label{font-size:9px;color:var(--muted);font-weight:700;letter-spacing:.3px;}
.nav-btn.active .nav-label{color:var(--gold);}
#filter-gear-icon{display:inline-block;transition:transform .3s ease,color .3s ease;}
#filter-btn.active #filter-gear-icon{transform:rotate(45deg);filter:drop-shadow(0 0 4px #00FF9D);}

/* ── DRAWERS ── */
.drawer{
  position:absolute;bottom:0;left:0;right:0;z-index:2000;
  background:var(--card);backdrop-filter:blur(32px);-webkit-backdrop-filter:blur(32px);
  border-top:1px solid var(--border);border-radius:24px 24px 0 0;
  transform:translateY(102%);transition:transform .38s cubic-bezier(.34,1.56,.64,1);
  max-height:72vh;display:flex;flex-direction:column;
  padding-bottom:calc(8px + env(safe-area-inset-bottom));
}
.drawer.open{transform:translateY(0);}
.drawer-handle{width:36px;height:4px;background:rgba(255,255,255,.14);border-radius:4px;margin:10px auto 0;flex-shrink:0;}
.drawer-title{font-size:13px;font-weight:800;color:var(--text);padding:12px 16px 8px;
  letter-spacing:.3px;border-bottom:1px solid var(--border);flex-shrink:0;}

/* ── SEARCH ── */
#search-input{
  margin:10px 14px 6px;padding:10px 14px;border-radius:12px;
  background:var(--bg2);border:1px solid var(--border);color:var(--text);
  font-size:14px;outline:none;-webkit-user-select:text;user-select:text;flex-shrink:0;
}
#search-input::placeholder{color:var(--muted);}
#search-results{flex:1;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;padding:0 8px 4px;-webkit-overflow-scrolling:touch;}
.result-item{
  padding:9px 10px;border-radius:12px;margin-bottom:4px;cursor:pointer;
  transition:background .13s;border:1px solid transparent;
}
.result-item:active{background:var(--bg2);border-color:var(--border);}
.r1{font-size:13px;font-weight:700;color:var(--text);}
.r2{font-size:11px;color:var(--muted);margin-top:2px;}

/* ── CALENDAR ── */
#cal-district-lbl{font-size:15px;font-weight:900;color:var(--gold);padding:4px 16px 2px;letter-spacing:-.2px;}
#cal-recycle-lbl{font-size:11px;color:var(--emerald);padding:0 16px 10px;font-weight:600;}
#week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;padding:0 12px 12px;flex-shrink:0;}
.day-cell{
  aspect-ratio:1;border-radius:10px;background:var(--bg2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:9px;gap:1px;border:1px solid var(--border);
}
.day-cell.today{border-color:var(--gold);animation:border-pulse 2s ease-in-out infinite;
  box-shadow:0 0 10px rgba(245,158,11,.22);}
.day-cell .dn{font-size:8px;color:var(--muted);font-weight:700;letter-spacing:.3px;}
.day-cell .dd{font-size:14px;font-weight:800;color:var(--text);}
@keyframes border-pulse{0%,100%{box-shadow:0 0 6px rgba(245,158,11,.18)}50%{box-shadow:0 0 14px rgba(245,158,11,.45)}}

/* ── POPUP ── */
/* Glassmorphism 2.0 */
.custom-popup .leaflet-popup-content-wrapper{
  background:var(--card)!important;border:1px solid var(--border)!important;
  border-radius:18px!important;box-shadow:0 10px 40px rgba(0,0,0,.55)!important;
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  padding:0!important;min-width:224px;overflow:hidden;
}
.custom-popup .leaflet-popup-tip-container{display:none;}
.custom-popup .leaflet-popup-content{margin:0!important;padding:16px!important;}
.pu-type{font-size:11px;font-weight:800;letter-spacing:.5px;margin-bottom:5px;text-transform:uppercase;}
.pu-type.g{color:var(--yellow-neon);}
.pu-type.r{color:var(--green-neon);}
.pu-time{font-size:34px;font-weight:900;line-height:1;margin-bottom:5px;letter-spacing:-1.5px;}
.pu-time.g{color:var(--gold);}
.pu-time.r{color:var(--emerald);}
.pu-loc{font-size:12px;font-weight:700;color:var(--text);margin-bottom:3px;}
.pu-vil{font-size:11px;color:var(--muted);margin-bottom:6px;}
.pu-cd{font-size:12px;font-weight:700;color:var(--neon-blue);margin-bottom:6px;}
.pu-note{font-size:10px;color:var(--muted);line-height:1.55;padding:7px 9px;
  background:rgba(255,255,255,.04);border-radius:8px;border-left:2px solid;}
.pu-note.g{border-color:var(--gold);}
.pu-note.r{border-color:var(--emerald);}

/* ── MARKERS ── */
.mk-wrap{position:relative;display:flex;align-items:center;justify-content:center;}
.pr{position:absolute;border-radius:50%;animation:radar-ring 2.2s ease-out infinite;}
.pr1y{width:34px;height:34px;background:rgba(255,229,0,.20);animation-delay:0s;}
.pr2y{width:50px;height:50px;background:rgba(255,229,0,.11);animation-delay:.55s;}
.pr3y{width:66px;height:66px;background:rgba(255,229,0,.06);animation-delay:1.1s;}
.pr1g{width:34px;height:34px;background:rgba(0,255,157,.20);animation-delay:0s;}
.pr2g{width:50px;height:50px;background:rgba(0,255,157,.11);animation-delay:.55s;}
.pr3g{width:66px;height:66px;background:rgba(0,255,157,.06);animation-delay:1.1s;}
@keyframes radar-ring{0%{transform:scale(.45);opacity:1}100%{transform:scale(1.25);opacity:0}}
@keyframes mk-breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
.zoom-breathe .mk-core{animation:mk-breathe 2.8s ease-in-out infinite;}
.mk-core{border-radius:50%;display:flex;align-items:center;justify-content:center;
  position:relative;z-index:2;transition:transform .4s cubic-bezier(.34,1.56,.64,1);}
.mk-core.g{background:rgba(255,229,0,.13);border:2px solid var(--yellow-neon);}
.mk-core.r{background:rgba(0,255,157,.13);border:2px solid var(--green-neon);}
#app.sleep-mode .pr{animation:none;opacity:0!important;}
.low-power .pr{animation:none;opacity:0!important;}

/* ── ANIMS ── */
@keyframes pulse-dot{0%,100%{opacity:1}50%{opacity:.35}}

/* ── NIGHT / SLEEP ── */
#app.sleep-mode{--bg:#0A0520;}
#app.sleep-mode #top-panel,#app.sleep-mode #bottom-nav{background:rgba(15,6,40,.92);}
#app.sleep-mode #status-text{color:#A78BFA;}

/* ── TOAST ── */
#toast{
  position:absolute;left:50%;transform:translateX(-50%) translateY(-14px);
  z-index:4000;background:rgba(17,25,45,.96);border:1px solid var(--border);
  border-radius:14px;padding:8px 18px;font-size:12px;font-weight:700;
  color:var(--text);opacity:0;transition:opacity .28s,transform .28s;
  pointer-events:none;white-space:pre-wrap;backdrop-filter:blur(16px);
  max-width:calc(100vw - 28px);text-align:center;top:90px;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ── NEARBY ── */
#nearby-panel{
  position:absolute;left:10px;right:10px;z-index:900;
  background:var(--card);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  border:1px solid var(--border);border-radius:16px;padding:10px 12px;
  display:none;transition:opacity .3s;
}
#nearby-panel.visible{display:block;}
.nb-title{font-size:9px;font-weight:800;color:var(--muted);letter-spacing:.5px;margin-bottom:6px;text-transform:uppercase;}
.nb-item{display:flex;justify-content:space-between;align-items:center;
  padding:5px 0;border-bottom:1px solid var(--border);}
.nb-item:last-child{border-bottom:none;}
.nb-name{font-size:12px;font-weight:700;color:var(--text);}
.nb-dist{font-size:11px;color:var(--neon-blue);font-weight:700;}

/* ── ZOOM HINT ── */
#zoom-hint{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:900;
  background:rgba(11,15,25,.88);border:1px solid var(--border);border-radius:14px;
  padding:10px 18px;font-size:12px;font-weight:700;color:var(--muted);
  pointer-events:none;display:none;backdrop-filter:blur(14px);white-space:nowrap;
}
#zoom-hint.vis{display:block;}

/* ── OVERLAY ── */
#doverlay{position:absolute;inset:0;z-index:1990;background:rgba(0,0,0,.42);
  display:none;backdrop-filter:blur(3px);}
#doverlay.show{display:block;}

/* ── CNY ── */
#cny-modal{
  position:absolute;inset:0;z-index:6000;background:rgba(0,0,0,.94);
  display:none;align-items:center;justify-content:center;flex-direction:column;
  gap:14px;padding:28px;
}
#cny-modal.show{display:flex;}
.cny-txt{font-size:15px;font-weight:800;color:#EF4444;text-align:center;line-height:1.9;}

/* ── SCROLLBAR ── */
#search-results::-webkit-scrollbar{width:3px;}
#search-results::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
.leaflet-control-zoom{display:none!important;}
.leaflet-control-attribution{font-size:9px!important;opacity:.35!important;
  background:rgba(0,0,0,.35)!important;color:var(--muted)!important;}
.leaflet-popup-close-button{color:var(--muted)!important;font-size:18px!important;right:12px!important;top:10px!important;}
</style>
</head>
<body>
<div id="app">
  <div id="top-panel">
    <div id="status-row">
      <div id="status-dot"></div>
      <span id="status-text">初始化系統中...</span>
      <button id="theme-btn" aria-label="切換主題">☀️</button>
    </div>
    <div id="district-scroll"></div>
  </div>
  <div id="map"></div>
  <div id="bottom-nav">
    <button class="nav-btn" id="locate-btn">
      <span class="nav-icon">📍</span><span class="nav-label">定位</span>
    </button>
    <button class="nav-btn" id="search-btn">
      <span class="nav-icon">🔍</span><span class="nav-label">搜尋</span>
    </button>
    <button class="nav-btn" id="cal-btn">
      <span class="nav-icon">📅</span><span class="nav-label">日曆</span>
    </button>
    <button class="nav-btn" id="filter-btn">
      <span id="filter-gear-icon" class="nav-icon">⚙️</span><span class="nav-label">過濾</span>
    </button>
  </div>
  <div id="skeleton">
    <div style="display:flex;flex-direction:column;gap:9px;width:190px;">
      <div class="sk-bar" style="width:68%;"></div>
      <div class="sk-bar" style="width:88%;"></div>
      <div class="sk-bar" style="width:52%;"></div>
    </div>
    <div id="prog-wrap"><div id="prog-bar"></div></div>
    <div id="progress-text">載入班表資料...</div>
  </div>
  <div id="zoom-hint">請放大（Zoom ≥ 14）以查看站點</div>
  <div id="nearby-panel">
    <div class="nb-title">步行最近站點</div>
    <div id="nearby-list"></div>
  </div>
  <div id="toast"></div>
  <div id="doverlay"></div>
  <!-- SEARCH DRAWER -->
  <div class="drawer" id="sdrawer">
    <div class="drawer-handle"></div>
    <div class="drawer-title">🔍 搜尋地點 · 里別 · 時間</div>
    <input id="search-input" type="text" placeholder="輸入路名、里名、時間片段..." autocomplete="off" autocorrect="off" spellcheck="false">
    <div id="search-results"></div>
  </div>
  <!-- CALENDAR DRAWER -->
  <div class="drawer" id="cdrawer">
    <div class="drawer-handle"></div>
    <div class="drawer-title">📅 本週收運日曆</div>
    <div id="cal-district-lbl">— 請選擇行政區 —</div>
    <div id="cal-recycle-lbl"></div>
    <div id="week-grid"></div>
  </div>
  <!-- CNY MODAL -->
  <div id="cny-modal">
    <div style="font-size:44px;">🧨</div>
    <div class="cny-txt">清潔隊員也想回家過年！<br>今日全市全面停收，<br>請把垃圾乖乖留在家中！</div>
    <div style="font-size:12px;color:#94A3B8;margin-top:8px;">點擊任意位置關閉</div>
  </div>
</div>
<script>
(function(){
'use strict';

/* ═══════════════════════════════
   CONSTANTS
═══════════════════════════════ */
const DATASET_ID = '57aaa860-bb03-43c2-a797-73971d6cc73d';
const CACHE_KEY  = 'tn_garbage_v5';
const CACHE_TTL  = 7 * 24 * 3600 * 1000;
const GEO_FENCE  = { latMin:22.8, latMax:23.5, lngMin:120.0, lngMax:120.6 };
const TAINAN_SW  = [22.85, 120.00];
const TAINAN_NE  = [23.45, 120.65];
const CHUNK_SIZE = 200;
const CIRCLE_BUFFER_M = 1500;
const DAY_ZH  = ['日','一','二','三','四','五','六'];
const DISTRICTS = ['仁德','東區','永康','中西區','安南','北區','南區','安平','新營','麻豆','歸仁','善化','關廟','左鎮','玉井'];
const DISTRICT_COORDS = {
  '仁德':[22.945,120.242],'東區':[22.993,120.218],'永康':[23.032,120.255],
  '中西區':[22.991,120.198],'安南':[23.043,120.170],'北區':[23.013,120.210],
  '南區':[22.970,120.188],'安平':[22.992,120.157],'新營':[23.310,120.312],
  '麻豆':[23.183,120.253],'歸仁':[22.952,120.289],'善化':[23.140,120.302],
  '關廟':[22.915,120.316],'左鎮':[23.000,120.330],'玉井':[23.118,120.432],
};
const PROXY_BUILDERS = [
  u => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
  u => `https://corsproxy.io/?${encodeURIComponent(u)}`,
  u => `https://thingproxy.freeboard.io/fetch/${encodeURIComponent(u)}`,
  u => `https://proxy.cors.sh/${encodeURIComponent(u)}`,
  u => `https://cors-anywhere.herokuapp.com/${u}`,
];
const DATA_URLS = [
  `https://data.gov.tw/api/v2/datasets/${DATASET_ID}`,
  `https://opendata.tainan.gov.tw/api/v1/rest/datastore/${DATASET_ID}?limit=50000`,
  `https://data.tainan.gov.tw/api/action/datastore_search?resource_id=${DATASET_ID}&limit=50000`,
];

/* ═══════════════════════════════
   STATE
═══════════════════════════════ */
let allPoints    = [];
let markerMap    = {};
let markerLayer, routeLayer, walkPolyline;
let isFilterActive = false;
let isFlying     = false;
let flyLock      = false;
let userLat = null, userLng = null;
let smoothHeading = 0, rawHeading = 0;
let userMarker   = null;
let serverDelta  = 0;
let audioCtx     = null;
let audioUnlocked = false;
let isLowPower   = false;
let isSleepMode  = false;
let isDark       = true;
let activeDistrict = null;
let memoryFallback = null;
let sleepTimer   = null;

/* ═══════════════════════════════
   MAP INIT
═══════════════════════════════ */
const map = L.map('map', {
  center: [23.00, 120.24],
  zoom: 14,
  maxBounds: L.latLngBounds(TAINAN_SW, TAINAN_NE),
  maxBoundsViscosity: 1.0,
  zoomControl: false,
  attributionControl: true,
  preferCanvas: true,
  bounceAtZoomLimits: true,
});
let tileLayer = makeTile(true);
tileLayer.addTo(map);
markerLayer = L.layerGroup().addTo(map);
routeLayer  = L.layerGroup().addTo(map);

function makeTile(dark) {
  return dark
    ? L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_matter/{z}/{x}/{y}{r}.png',
        { attribution:'© CartoDB', subdomains:'abcd', maxZoom:19 })
    : L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',
        { attribution:'© CartoDB', subdomains:'abcd', maxZoom:19 });
}

/* ═══════════════════════════════
   THEME
═══════════════════════════════ */
document.getElementById('theme-btn').addEventListener('click', () => {
  isDark = !isDark;
  document.body.classList.toggle('light-mode', !isDark);
  document.getElementById('theme-btn').textContent = isDark ? '☀️' : '🌙';
  tileLayer.remove();
  tileLayer = makeTile(isDark);
  tileLayer.addTo(map);

/* ═══════════════════════════════

═══════════════════════════════ */
function ensureAudio() {
  if (audioCtx) return;
  try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
}
function unlockAudio() {
  if (audioUnlocked || isLowPower) return;
  ensureAudio();
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
  audioUnlocked = true;
}
document.addEventListener('click', unlockAudio, { once: true });
document.addEventListener('touchstart', unlockAudio, { once: true, passive: true });

function playPluck() {
  if (!audioUnlocked || !audioCtx || isLowPower) return;
  try {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.type = 'triangle';
    o.frequency.setValueAtTime(300, audioCtx.currentTime);
    o.frequency.exponentialRampToValueAtTime(85, audioCtx.currentTime + .13);
    g.gain.setValueAtTime(.16, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, audioCtx.currentTime + .14);
    o.start(audioCtx.currentTime); o.stop(audioCtx.currentTime + .15);
  } catch(e) {}
}
function playTink() {
  if (!audioUnlocked || !audioCtx || isLowPower) return;
  try {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.type = 'sine';
    o.frequency.setValueAtTime(1350, audioCtx.currentTime);
    o.frequency.exponentialRampToValueAtTime(680, audioCtx.currentTime + .2);
    g.gain.setValueAtTime(.11, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, audioCtx.currentTime + .22);
    o.start(audioCtx.currentTime); o.stop(audioCtx.currentTime + .23);
  } catch(e) {}
}
function playClick() {
  if (!audioUnlocked || !audioCtx || isLowPower) return;
  try {
    const len = Math.floor(audioCtx.sampleRate * .035);
    const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random()*2-1) * Math.exp(-i / (len * .14));
    const src = audioCtx.createBufferSource(), g = audioCtx.createGain();
    src.buffer = buf; src.connect(g); g.connect(audioCtx.destination);
    g.gain.setValueAtTime(.075, audioCtx.currentTime);
    src.start(audioCtx.currentTime);
  } catch(e) {}
}
function playWhoosh() {
  if (!audioUnlocked || !audioCtx || isLowPower) return;
  try {
    const dur = .65;
    const len = Math.floor(audioCtx.sampleRate * dur);
    const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) {
      const t = i / len;
      d[i] = (Math.random()*2-1) * Math.sin(t * Math.PI) * Math.exp(-t * 2.8) * .07;
    }
    const src = audioCtx.createBufferSource(), g = audioCtx.createGain();
    src.buffer = buf; src.connect(g); g.connect(audioCtx.destination);
    g.gain.setValueAtTime(.09, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, audioCtx.currentTime + dur);
    src.start(audioCtx.currentTime);
  } catch(e) {}
}

  let diff   = 14 * 60 - cur;
  if (diff <= 0) diff += 24 * 60;
  return ` 下期清運倒數：${Math.floor(diff/60)} 小時 ${diff%60} 分`;
}

/* ═══════════════════════════════
   PROXY FETCH WITH TIMEOUT + RETRY
═══════════════════════════════ */
async function fetchRaw(url, timeoutMs = 6000) {
  const ctrl = new AbortController();
  const tid  = setTimeout(() => ctrl.abort(), timeoutMs);
  try {
    const res  = await fetch(url, { signal: ctrl.signal });
    clearTimeout(tid);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    if (!text || text.trim().startsWith('<!')) throw new Error('Not JSON');
    return text;
  } finally {
    clearTimeout(tid);
  }
}

async function fetchViaProxies(targetUrl, maxRetry = 3) {
  for (let pi = 0; pi < PROXY_BUILDERS.length; pi++) {
    for (let attempt = 0; attempt < maxRetry; attempt++) {
      try {
        const proxyUrl = PROXY_BUILDERS[pi](targetUrl);
        const text = await fetchRaw(proxyUrl, 6000);
        return text;
      } catch(e) {
        if (attempt < maxRetry - 1) await sleep(2000);
      }
    }
  }
  throw new Error('All proxies exhausted');
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

/* ═══════════════════════════════
   JSON SAFE PARSE (strip BOM)
═══════════════════════════════ */
function safeParse(str) {
  try {
    const clean = str.replace(/^\uFEFF/, '').replace(/^\u200B/, '').trim();
    return JSON.parse(clean);
  } catch(e) { return null; }
}

/* ═══════════════════════════════
   FETCH DATA (TWO-STAGE)
═══════════════════════════════ */
async function fetchTainanData() {
  // Stage 1 – resolve metadata to find download URL
  let downloadUrl = null;
  try {
    const metaText = await fetchViaProxies(DATA_URLS[0], 2);
    const meta = safeParse(metaText);
    if (meta) {
      const res = meta.result || meta;
      const resources = res.resources || res.distribution || [];
      for (const r of resources) {
        const u = r.download_url || r.accessURL || r.url || '';
        if (u && (u.toLowerCase().includes('.json') || u.toLowerCase().includes('json'))) {
          downloadUrl = u; break;
        }
      }
      // Sometimes data is inline
      if (!downloadUrl && Array.isArray(res.records) && res.records.length > 0) return res.records;
      if (!downloadUrl && Array.isArray(res) && res.length > 0) return res;
    }
  } catch(e) {}

  // Stage 2 – try all candidate URLs
  const candidates = [downloadUrl, ...DATA_URLS.slice(1)].filter(Boolean);
  for (const cu of candidates) {
    try {
      const raw = await fetchViaProxies(cu, 3);
      const obj = safeParse(raw);
      if (!obj) continue;
      const arr = obj.result?.records || obj.records || obj.data || obj.results || obj;
      if (Array.isArray(arr) && arr.length > 0) return arr;
    } catch(e) {}
  }
  throw new Error('Data unavailable');
}

/* ═══════════════════════════════
   CACHE (Stale-While-Revalidate)
═══════════════════════════════ */
function loadCache() {
  try {
    const raw = localStorage.getItem(CACHE_KEY);
    if (!raw) return null;
    const obj = JSON.parse(raw);
    if (!obj || !obj.ts || !Array.isArray(obj.data)) return null;
    const age = Math.abs(nowMs() - obj.ts);
    return { data: obj.data, stale: age > CACHE_TTL };
  } catch(e) { return null; }
}
function _compressForCache(arr) {
  // 字串矩陣優化：只保留必要欄位，剔除渲染用內部屬性
  return arr.map(p => {
    const o = {};
    for (const k of ['LATITUDE','LONGITUDE','TIME','AREA','VILLAGE','POINTNAME','WORDDAY','RECYCLEDAY','ROUTEID']) {
      if (p[k] !== undefined) o[k] = p[k];
    }
    return o;
  });
}
function saveCache(data) {
  try {
    const compressed = _compressForCache(data);
    localStorage.setItem(CACHE_KEY, JSON.stringify({ ts: nowMs(), data: compressed }));
  } catch(e) {
    if (e.name === 'QuotaExceededError' || e.name === 'NS_ERROR_DOM_QUOTA_REACHED') {
      memoryFallback = data;
      showToast('⚠️ 手機空間已完全塞爆！目前改用記憶體臨時查詢，倒完垃圾請趕快清理手機空間！', 6000);
    }
  }
}

/* ═══════════════════════════════
   NORMALISE FIELD NAMES (UPPERCASE)
═══════════════════════════════ */
const FIELD_MAP = {
  latitude:'LATITUDE',longitude:'LONGITUDE',time:'TIME',area:'AREA',
  village:'VILLAGE',pointname:'POINTNAME',wordday:'WORDDAY',
  recycleday:'RECYCLEDAY',routeid:'ROUTEID',
};
function normalise(raw) {
  const out = {};
  for (const k of Object.keys(raw)) {
    const up = FIELD_MAP[k.toLowerCase()];
    if (up) out[up] = raw[k];
    else out[k] = raw[k];
  }
  // Also keep existing uppercase keys
  for (const k of Object.keys(FIELD_MAP).map(v => FIELD_MAP[v])) {
    if (raw[k] !== undefined) out[k] = raw[k];
  }
  return out;
}

/* ═══════════════════════════════
   GEO FENCE VALIDATION
═══════════════════════════════ */
function validGeo(p) {
  const lat = parseFloat(p.LATITUDE), lng = parseFloat(p.LONGITUDE);
  if (isNaN(lat) || isNaN(lng) || lat === 0 || lng === 0) return false;
  return lat >= GEO_FENCE.latMin && lat <= GEO_FENCE.latMax &&
         lng >= GEO_FENCE.lngMin && lng <= GEO_FENCE.lngMax;
}

/* ═══════════════════════════════
   SEMANTIC SPLIT (GARBAGE + RECYCLE)
═══════════════════════════════ */
const RECYCLE_KW = ['回收','資源','紙類','鐵鋁','玻璃','舊衣','電池','廢棄'];
function splitIntoRenderObjects(rawArr) {
  const result = [];
  for (const raw of rawArr) {
    const p = normalise(raw);
    if (!validGeo(p)) continue;
    const pn  = String(p.POINTNAME || '');
    const rd  = String(p.RECYCLEDAY || '').trim();
    const wd  = String(p.WORDDAY || '').trim();
    const hasRecycle = rd && rd !== '無' && rd !== '' && rd !== '—';
    const hasMixed   = RECYCLE_KW.some(k => pn.includes(k) || rd.includes(k));
    p._type = 'garbage';
    p._id   = (p.POINTNAME || '') + '_' + (p.TIME || '');
    result.push({ ...p });
    if (hasRecycle || hasMixed) {
      const lat = parseFloat(p.LATITUDE), lng = parseFloat(p.LONGITUDE);
      result.push({
        ...p, _type:'recycle', RECYCLEDAY: rd || wd,
        _id: (p.POINTNAME || '') + '_' + (p.TIME || '') + '_R',
        LATITUDE: String(lat), LONGITUDE: String(lng),
      });
    }
  }
  return result;
}

/* ═══════════════════════════════
   SPIDER OFFSET (anti-overlap)
═══════════════════════════════ */
function spiderOffset(points, zoom) {
  if (zoom < 16) return points;
  const groups = {};
  for (const p of points) {
    const key = parseFloat(p.LATITUDE).toFixed(4) + '_' + parseFloat(p.LONGITUDE).toFixed(4);
    if (!groups[key]) groups[key] = [];
    groups[key].push(p);
  }
  const out = [];
  for (const key of Object.keys(groups)) {
    const grp = groups[key];
    if (grp.length <= 1) { out.push(...grp); continue; }
    for (let i = 0; i < grp.length; i++) {
      const cp = { ...grp[i] };
      if (cp._type === 'recycle' && i > 0) {
        cp.LATITUDE  = String(parseFloat(cp.LATITUDE)  + 0.0001);
      }
      out.push(cp);
    }
  }
  return out;
}

/* ═══════════════════════════════
   HAVERSINE
═══════════════════════════════ */
function haversine(la1, lo1, la2, lo2) {
  const R = 6371000, d = Math.PI/180;
  const dla = (la2-la1)*d, dlo = (lo2-lo1)*d;
  const a = Math.sin(dla/2)**2 + Math.cos(la1*d)*Math.cos(la2*d)*Math.sin(dlo/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

/* ═══════════════════════════════
   CIRCLE BUFFER FILTER (spatial)
═══════════════════════════════ */
function inCircleBuffer(p, clat, clng, radiusM) {
  const lat = parseFloat(p.LATITUDE), lng = parseFloat(p.LONGITUDE);
  return haversine(clat, clng, lat, lng) <= radiusM;
}

/* ═══════════════════════════════
   TIME UTILS
═══════════════════════════════ */
function timeToMin(t) {
  if (!t) return -1;
  const m = String(t).match(/(\d{1,2})[:\s：](\d{2})/);
  return m ? parseInt(m[1]) * 60 + parseInt(m[2]) : -1;
}
function countdownStr(timeStr) {
  const mins = timeToMin(timeStr);
  if (mins < 0) return '';
  const now = new Date(nowMs());
  const nowMin = now.getHours() * 60 + now.getMinutes();
  let diff = mins - nowMin;
  if (diff < -60) diff += 24 * 60; // cross-midnight fix
  if (diff < 0) return '⬛ 已過站';
  if (diff === 0) return '🚛 進站中！';
  const h = Math.floor(diff/60), m = diff % 60;
  return h > 0 ? `⏱ 約 ${h} 時 ${m} 分後抵達` : `⏱ 約 ${m} 分後抵達`;
}

}

/* ═══════════════════════════════
   ROUTE POLYLINES
═══════════════════════════════ */
function drawRoutes(pts, zoom) {
  routeLayer.clearLayers();
  if (zoom < 15 || isLowPower || isSleepMode) return;
  const byRoute = {};
  for (const p of pts) {
    if (p._type !== 'garbage') continue;
    const rid = (p.ROUTEID || '').trim() || `${p.AREA||'X'}_${p.VILLAGE||'Y'}`;
    if (!byRoute[rid]) byRoute[rid] = [];
    byRoute[rid].push(p);
  }
  for (const rid of Object.keys(byRoute)) {
    const sorted = byRoute[rid].sort((a,b) => timeToMin(a.TIME) - timeToMin(b.TIME));
    if (sorted.length < 2) continue;
    const lls = sorted.map(p => [parseFloat(p.LATITUDE), parseFloat(p.LONGITUDE)]);
    // Cross-area guard: skip if any segment > 3 km
    let ok = true;
    for (let i = 0; i < lls.length - 1; i++) {
      if (haversine(lls[i][0], lls[i][1], lls[i+1][0], lls[i+1][1]) > 3000) { ok = false; break; }
    }
    if (!ok) continue;
    L.polyline(lls, { color:'#00F2FE', weight:2, opacity:.42, dashArray:'5,7' }).addTo(routeLayer);
  }
}

/* ═══════════════════════════════
   WALK LINE (Manhattan L-shape)
═══════════════════════════════ */
function drawWalkLine(ulat, ulng, tlat, tlng) {
  if (walkPolyline) { walkPolyline.remove(); walkPolyline = null; }
  if (!ulat || !tlat) return;
  walkPolyline = L.polyline(
    [[ulat, ulng], [tlat, ulng], [tlat, tlng]],
    { color:'#00FF9D', weight:2, opacity:.52, dashArray:'6,5' }
  ).addTo(map);
}

/* ═══════════════════════════════
   NEARBY PANEL
═══════════════════════════════ */
function updateNearby(lat, lng) {
  if (!lat || !lng || !allPoints.length) return;
  const day = todayZH();
  const pool = allPoints.filter(p => p._type === 'garbage' && (String(p.WORDDAY || '')).includes(day));
  const sorted = pool
    .map(p => ({ ...p, _dist: haversine(lat, lng, parseFloat(p.LATITUDE), parseFloat(p.LONGITUDE)) }))
    .filter(p => p._dist <= 500)
    .sort((a,b) => a._dist - b._dist)
    .slice(0, 3);
  const panel = document.getElementById('nearby-panel');
  const list  = document.getElementById('nearby-list');
  const nb    = document.getElementById('nearby-panel');
  const botH  = document.getElementById('bottom-nav').offsetHeight + 8;
  nb.style.bottom = botH + 'px';
  if (!sorted.length) { panel.classList.remove('visible'); return; }
  panel.classList.add('visible');
  list.innerHTML = sorted.map((p, i) => {
    const mDist  = Math.round(p._dist * 1.42); // Manhattan correction
    const walkMin = Math.ceil(mDist / 80);
    return `<div class="nb-item" data-i="${i}">
      <div class="nb-name">📍 ${p.AREA||''} ${p.POINTNAME||''}</div>
      <div class="nb-dist">${mDist}m · ${walkMin}分</div>
    </div>`;
  }).join('');
  if (sorted.length > 0) drawWalkLine(lat, lng, parseFloat(sorted[0].LATITUDE), parseFloat(sorted[0].LONGITUDE));
}

/* ═══════════════════════════════
   USER MARKER (beam + compass)
═══════════════════════════════ */
function updateUserMarker(lat, lng, heading) {
  smoothHeading = smoothHeading * 0.85 + heading * 0.15;
  const rot = smoothHeading - 25;
  const html = `<div style="position:relative;width:60px;height:60px;">
    <div style="position:absolute;inset:0;border-radius:50%;
      background:conic-gradient(rgba(59,130,246,.45) 0deg 55deg,transparent 55deg 360deg);
      transform:rotate(${rot}deg);"></div>
    <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
      width:14px;height:14px;border-radius:50%;background:#3B82F6;border:2.5px solid #fff;
      box-shadow:0 0 10px rgba(59,130,246,.85);"></div>
  </div>`;
  if (!userMarker) {
    userMarker = L.marker([lat,lng], { icon: L.divIcon({ html, className:'', iconSize:[60,60], iconAnchor:[30,30] }) }).addTo(map);
  } else {
    userMarker.setLatLng([lat,lng]);
    userMarker.setIcon(L.divIcon({ html, className:'', iconSize:[60,60], iconAnchor:[30,30] }));
  }
}

/* ═══════════════════════════════
   DEVICE ORIENTATION (Low-pass)
═══════════════════════════════ */
function attachOrientation() {
  window.addEventListener('deviceorientation', e => {
    let h = 0;
    if (e.webkitCompassHeading !== undefined) h = e.webkitCompassHeading || 0;
    else if (e.alpha !== null) h = 360 - (e.alpha || 0);
    rawHeading = h;
    if (userMarker && userLat) updateUserMarker(userLat, userLng, rawHeading);
  }, true);
}
attachOrientation();

/* ═══════════════════════════════
   LOCATE BUTTON
═══════════════════════════════ */
document.getElementById('locate-btn').addEventListener('click', () => {
  vibrate(12); playPluck();
  if (typeof DeviceOrientationEvent !== 'undefined' &&
      typeof DeviceOrientationEvent.requestPermission === 'function') {
    DeviceOrientationEvent.requestPermission().then(s => {
      if (s === 'granted') attachOrientation();
    }).catch(() => {});
  }
  if (!navigator.geolocation) { showToast('裝置不支援定位功能'); return; }
  setStatus('📡 定位中...');
  navigator.geolocation.getCurrentPosition(pos => {
    userLat = pos.coords.latitude;
    userLng = pos.coords.longitude;
    updateUserMarker(userLat, userLng, rawHeading);
    if (!flyLock) {
      flyLock = true; playWhoosh();
      map.flyTo([userLat, userLng], 16, { duration: 1.5, easeLinearity: .22 });
    }
    updateNearby(userLat, userLng);
    setStatus('🟢 已定位至您的位置');
  }, () => {
    setStatus('定位失敗', '#F87171');
    showToast('定位失敗，請確認位置權限已開啟');
  }, { enableHighAccuracy: true, timeout: 12000, maximumAge: 0 });
});

/* ═══════════════════════════════
   MAP EVENTS
═══════════════════════════════ */
// Refresh countdown every time a popup opens
map.on('popupopen', () => {
  setTimeout(() => {
    const cdEl = document.querySelector('.leaflet-popup-content .pu-cd');
    const tEl  = document.querySelector('.leaflet-popup-content .pu-time');
    if (cdEl && tEl) {
      const fresh = countdownStr(tEl.textContent.trim());
      if (fresh) cdEl.textContent = fresh;
    }
  }, 80);
});
map.on('moveend', () => {
  flyLock = false; isFlying = false;
  refreshVisible();
  if (userLat) updateNearby(userLat, userLng);
});
map.on('zoomend', () => refreshVisible());
map.on('move', () => {
  if (userLat) updateNearby(userLat, userLng);
});

/* ═══════════════════════════════
   MAIN RENDER (idempotent)
═══════════════════════════════ */
let renderScheduled = false;
function refreshVisible() {
  if (renderScheduled) return;
  renderScheduled = true;
  requestAnimationFrame(() => {
    renderScheduled = false;
    _doRender();
  });
}
function _doRender() {
  const zoom = map.getZoom();
  const hint = document.getElementById('zoom-hint');
  if (zoom < 14) {
    hint.classList.add('vis');
    markerLayer.clearLayers();
    routeLayer.clearLayers();
    markerMap = {};
    return;
  }
  hint.classList.remove('vis');
  if (isSleepMode) { markerLayer.clearLayers(); markerMap = {}; return; }
  const bounds = map.getBounds();
  // Circle buffer centre
  const ctr = map.getCenter();
  const filterRadius = isFilterActive ? CIRCLE_BUFFER_M : null;
  const pts = allPoints.filter(p => {
    const lat = parseFloat(p.LATITUDE), lng = parseFloat(p.LONGITUDE);
    if (!bounds.contains([lat, lng])) return false;
    if (isFilterActive) {
      const today = pointMatchesDay(p);
      if (!today) return false;
      if (filterRadius && !inCircleBuffer(p, ctr.lat, ctr.lng, filterRadius)) return false;
    }
    return true;
  });
  const offset = spiderOffset(pts, zoom);
  const newIds = new Set(offset.map(p => p._id));
  // Remove stale markers
  for (const id of Object.keys(markerMap)) {
    if (!newIds.has(id)) { markerLayer.removeLayer(markerMap[id]); delete markerMap[id]; }
  }
  // Add new
  for (const p of offset) {
    if (markerMap[p._id]) continue;
    const lat = parseFloat(p.LATITUDE), lng = parseFloat(p.LONGITUDE);
    const icon = buildIcon(p._type, zoom);
    const m = L.marker([lat, lng], { icon }).addTo(markerLayer);
    m.bindPopup(popupHTML(p), { className:'custom-popup', maxWidth:290, closeButton:true });
    m.on('click', () => {
      if (flyLock) return;
      vibrate(12);
      p._type === 'recycle' ? playTink() : playPluck();
      m.openPopup();
    });
    markerMap[p._id] = m;
  }
  drawRoutes(offset, zoom);
}

/* ═══════════════════════════════
   DISTRICT BUTTONS
═══════════════════════════════ */
function buildDistricts() {
  const sc = document.getElementById('district-scroll');
  sc.innerHTML = '';
  for (const d of DISTRICTS) {
    const btn = document.createElement('button');
    btn.className = 'district-btn';
    btn.textContent = d;
    btn.dataset.d = d;
    btn.addEventListener('click', () => {
      if (flyLock) return;
      vibrate(12); playClick(); playWhoosh();
      activeDistrict = d;
      document.querySelectorAll('.district-btn').forEach(b => b.classList.toggle('active', b.dataset.d === d));
      const c = DISTRICT_COORDS[d] || [23.0, 120.3];
      flyLock = true;
      map.flyTo(c, 15, { duration: 1.25, easeLinearity: .28 });
      setStatus(`🗺 ${d}`, '#F59E0B');
      updateCalDistrict(d);
    });
    sc.appendChild(btn);
  }
}
buildDistricts();

/* ═══════════════════════════════
   CALENDAR
═══════════════════════════════ */
function updateCalDistrict(district) {
  const lbl = document.getElementById('cal-district-lbl');
  const rec = document.getElementById('cal-recycle-lbl');
  lbl.textContent = district ? `${district}區 收運資訊` : '— 請選擇行政區 —';
  const pts = allPoints.filter(p => (p.AREA||'').includes(district) && (p.RECYCLEDAY||'').trim() && (p.RECYCLEDAY||'').trim() !== '無');
  const days = [...new Set(pts.map(p => p.RECYCLEDAY).filter(Boolean))].slice(0, 4).join('、');
  rec.textContent = days ? `♻️ 回收日：週${days}` : '♻️ 回收資訊載入中...';
}
function buildWeekGrid() {
  const grid = document.getElementById('week-grid');
  grid.innerHTML = '';
  const now = new Date(nowMs());
  const dow = now.getDay();
  for (let i = 0; i < 7; i++) {
    const cell = document.createElement('div');
    cell.className = 'day-cell' + (i === dow ? ' today' : '');
    const d = new Date(now);
    d.setDate(d.getDate() + (i - dow));
    cell.innerHTML = `<span class="dn">週${DAY_ZH[i]}</span><span class="dd">${d.getDate()}</span>`;
    grid.appendChild(cell);
  }
}

/* ═══════════════════════════════
   DRAWERS
═══════════════════════════════ */
const overlay = document.getElementById('doverlay');
function openDrawer(id) {
  closeDrawers();
  document.getElementById(id).classList.add('open');
  overlay.classList.add('show');
}
function closeDrawers() {
  document.querySelectorAll('.drawer').forEach(d => d.classList.remove('open'));
  overlay.classList.remove('show');
}
overlay.addEventListener('click', closeDrawers);

document.getElementById('search-btn').addEventListener('click', () => {
  vibrate(12); playClick();
  openDrawer('sdrawer');
  setTimeout(() => document.getElementById('search-input').focus(), 340);
});
document.getElementById('cal-btn').addEventListener('click', () => {
  vibrate(12); playClick();
  buildWeekGrid();
  if (activeDistrict) updateCalDistrict(activeDistrict);
  openDrawer('cdrawer');
});
document.getElementById('filter-btn').addEventListener('click', () => {
  vibrate(12); playClick();
  isFilterActive = !isFilterActive;
  document.getElementById('filter-btn').classList.toggle('active', isFilterActive);
  showToast(isFilterActive
    ? `✅ 已過濾：今天（週${todayZH()}）· 地圖中心 1.5km 範圍內`
    : '🔓 已顯示全部站點');
  refreshVisible();
});

/* ═══════════════════════════════
   SEARCH
═══════════════════════════════ */
let searchTimer = null;
document.getElementById('search-input').addEventListener('input', function() {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => doSearch(this.value), 140);
});
function escapeRE(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
function doSearch(q) {
  const res = document.getElementById('search-results');
  const safe = q.toLowerCase();
  if (!safe || safe.length < 1) { res.innerHTML = ''; return; }
  const found = allPoints.filter(p => p._type === 'garbage' && (
    (p.POINTNAME||'').toLowerCase().includes(safe) ||
    (p.AREA||'').toLowerCase().includes(safe) ||
    (p.VILLAGE||'').toLowerCase().includes(safe) ||
    (p.TIME||'').includes(safe)
  )).slice(0, 50);
  if (!found.length) {
    res.innerHTML = '<div style="padding:12px 12px;color:var(--muted);font-size:12px;">找不到符合站點，換個關鍵字試試</div>';
    return;
  }
  res.innerHTML = found.map((p, i) =>
    `<div class="result-item" data-i="${i}">
      <div class="r1">📍 ${p.AREA||''} · ${p.POINTNAME||''}</div>
      <div class="r2">🕒 ${p.TIME||''} | ${p.VILLAGE||''}</div>
    </div>`
  ).join('');
  res.querySelectorAll('.result-item').forEach((el, i) => {
    el.addEventListener('click', () => {
      vibrate(12); playTink();
      closeDrawers();
      document.getElementById('search-input').value = '';
      res.innerHTML = '';
      const p = found[i];
      const lat = parseFloat(p.LATITUDE), lng = parseFloat(p.LONGITUDE);
      if (!flyLock) {
        flyLock = true; playWhoosh();
        map.flyTo([lat, lng], 17, { duration: 1.2, easeLinearity: .25 });
        map.once('moveend', () => {
          flyLock = false;
          setTimeout(() => { if (markerMap[p._id]) markerMap[p._id].openPopup(); }, 250);
        });
      }
    });
  });
}

/* ═══════════════════════════════
   CHUNKED DATA PROCESSING
═══════════════════════════════ */
async function processChunked(rawArr) {
  return new Promise(resolve => {
    const total   = rawArr.length;
    let idx       = 0;
    let validated = [];
    function tick() {
      const end = Math.min(idx + CHUNK_SIZE, total);
      for (; idx < end; idx++) validated.push(rawArr[idx]);
      const pct = Math.min(92, Math.round((idx / total) * 82) + 8);
      setProgress(pct);
      if (idx < total) { setTimeout(tick, 0); return; }
      const split = splitIntoRenderObjects(validated);
      setProgress(100);
      resolve(split);
    }
    tick();
  });
}

/* ═══════════════════════════════
   INIT FLOW
═══════════════════════════════ */
async function init() {
  setProgress(5);
  // Stale-while-revalidate: immediate cache render
  const cached = loadCache();
  if (cached && Array.isArray(cached.data) && cached.data.length > 0) {
    setStatus('⚡ 讀取快取班表...', '#F59E0B');
    const pts = await processChunked(cached.data);
    allPoints = pts;
    hideSkeleton();
    refreshVisible();
    if (cached.stale) {
      setStatus('🔄 快取已過期，背景更新中...', '#F59E0B');
      fetchAndUpdate(false);
    } else {
      setStatus('🟢 營運中');
      checkSleepMode();
    }
  } else {
    setStatus('📡 連線抓取最新班表...');
    await fetchAndUpdate(true);
  }
}

async function fetchAndUpdate(showProgress) {
  try {
    const raw = await fetchTainanData();
    if (!Array.isArray(raw) || raw.length === 0) throw new Error('Empty');
    saveCache(raw);
    const pts = await processChunked(raw);
    allPoints = pts;
    if (showProgress) hideSkeleton();
    refreshVisible();
    if (userLat) updateNearby(userLat, userLng);
    setStatus('🟢 班表已更新');
    checkSleepMode();
  } catch(e) {
    const fallback = loadCache();
    const fd = fallback?.data || memoryFallback;
    if (fd && fd.length > 0) {
      const pts = await processChunked(fd);
      allPoints = pts;
      if (showProgress) hideSkeleton();
      refreshVisible();
      setStatus('💡 政府系統維護中，本助理已強制調度最穩固之歷史班表，請安心查詢！', '#F59E0B');
    } else {
      if (showProgress) hideSkeleton();
      setStatus('❌ 資料暫時無法取得，請稍後重整頁面', '#F87171');
      showToast('政府API暫時維護中，請稍後重新整理頁面');
    }
  }
}

/* ═══════════════════════════════
   BOTTOM NAV NEARBY POSITION
═══════════════════════════════ */
function fixNearbyBottom() {
  const nb  = document.getElementById('nearby-panel');
  const bh  = document.getElementById('bottom-nav').offsetHeight;
  nb.style.bottom = (bh + 10) + 'px';
}
window.addEventListener('resize', fixNearbyBottom);
fixNearbyBottom();

/* ═══════════════════════════════
   LIVE COUNTDOWN REFRESH
═══════════════════════════════ */
setInterval(() => {
  // Refresh open popup countdown
  const openPopup = document.querySelector('.leaflet-popup-content');
  if (openPopup) {
    const cdEl = openPopup.querySelector('.pu-cd');
    if (cdEl) {
      const timeEl = openPopup.querySelector('.pu-time');
      if (timeEl) {
        const t = timeEl.textContent.trim();
        cdEl.textContent = countdownStr(t) || cdEl.textContent;
      }
    }
  }
  // Also update sleep countdown in status
  if (isSleepMode) checkSleepMode();
}, 30000);

/* ═══════════════════════════════
   LAUNCH
═══════════════════════════════ */
init();

})();
